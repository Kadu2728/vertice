[project]
name = "vertice-backend"
version = "0.1.0"
description = "Motor determinístico e API do VÉRTICE"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "google-genai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: recalcula PU contra dado oficial publicado (ver docs/adr/ADR-005-golden-tests.md)",
    "integration: exige DATABASE_URL apontando para um Postgres real; pulado se ausente",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
files = ["domain", "application", "infra", "api"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
